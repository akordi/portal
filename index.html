<!doctype html>
<html lang="<%= HTML_LANG %>">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <title><%= VUE_APP_TITLE %></title>

    <link rel="icon" href="<%= BASE_URL %>favicon.ico" sizes="48x48" />
    <link rel="icon" href="<%= BASE_URL %>favicon.svg" sizes="any"  type="image/svg+xml" />

    <meta
      name="theme-color"
      content="#1483fb"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#07004d"
      media="(prefers-color-scheme: light)"
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="<%= BASE_URL %>" />
    <meta property="og:title" content="<%= VUE_APP_TITLE %>" />
    <meta property="og:image" content="<%= BASE_URL %>imgs/og.png" />
    <meta property="og:description" content="<%= VUE_APP_DESCRIPTION %>" />
    <meta property="og:site_name" content="<%= VUE_APP_NAME %>" />

    <script>
      window.config = {
        publicUrl: "<%= BASE_URL %>",
        version: "<%= VUE_APP_VERSION %>",
        environment: "<%= VUE_APP_ENVIRONMENT %>",
        serviceUrl: "<%= VUE_APP_SERVICE_URL %>",
        authUrl: "<%- VUE_APP_AUTH_URL %>",
        authEnabled: "<%- VUE_APP_AUTH_ENABLED %>",
        gtagId: "<%- VUE_APP_GTAG_ID %>",
        gtagEnabled: "<%- VUE_APP_GTAG_ENABLED %>",
        defaultLanguage: "<%- VUE_APP_DEFAULT_LANGUAGE %>",
      };
      window.data = {};
    </script>
  </head>

  <body class="lx">
    <!-- Same theme resolution as lx-ui, applied before first paint to avoid a light flash. -->
    <script>
      try {
        var theme = localStorage.getItem("akordi-theme") || "auto";
        if (theme === "auto") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.body.classList.add("lx-theme-" + theme);
      } catch {}
    </script>
    <noscript>
      <strong
        >We're sorry but <%= VUE_APP_NAME %> doesn't work properly without
        JavaScript enabled. Please enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
